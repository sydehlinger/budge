version: "4.12.0"

services:
  db:
    container_name: db
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
  nodeserver:
    container_name: budge-api
    image: node:20.8.0
    build:
      context: .
      dockerfile: ./apps/budge-api/Dockerfile.local
    command: npm run dev
    volumes:
      - .:/app/
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - 8080:8080
